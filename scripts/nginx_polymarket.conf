# Reverse proxy → Polymarket Streak Snapper dashboard
# Backend listens only on loopback (DASHBOARD_HOST=127.0.0.1) — this is the only
# public surface. `certbot --nginx -d <your.domain>` will enable TLS on top of
# this config; until then it serves plain HTTP.
#
# Runbook: docs/VPS_DEPLOY.md (or DEPLOY_QUICK.md).

# Cap body size: the dashboard only serves HTML/JSON.
client_max_body_size 1m;

# Security headers inherited by all proxied responses.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Timeouts aligned with bot's window cycle (5 min) + headroom.
proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

upstream polymarket_bot {
    server 127.0.0.1:5000;
    keepalive 8;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Plain HTTP for now. When TLS is enabled (certbot), the certbot-managed
    # 443 block takes over and the `if ($scheme = http)` redirect sends
    # everyone to https://.
    location / {
        proxy_pass http://polymarket_bot;
    }

    # Don't proxy health probes; nginx answers fast without touching the bot.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
