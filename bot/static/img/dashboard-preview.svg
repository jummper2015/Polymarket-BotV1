<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"
     aria-label="Vista previa del panel ME$IRVE">
  <defs>
    <linearGradient id="dp-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="dp-up" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#10b981" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dp-dn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ef4444" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </linearGradient>
    <filter id="dp-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dy="3" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Window chrome -->
  <g filter="url(#dp-shadow)">
    <rect x="20" y="14" width="520" height="332" rx="14" fill="url(#dp-card)" stroke="#e5e7eb"/>
    <!-- Title bar -->
    <rect x="20" y="14" width="520" height="36" rx="14" fill="#0f172a"/>
    <rect x="20" y="32" width="520" height="18"        fill="#0f172a"/>
    <!-- traffic lights -->
    <circle cx="38" cy="32" r="5" fill="#ef4444"/>
    <circle cx="54" cy="32" r="5" fill="#fbbf24"/>
    <circle cx="70" cy="32" r="5" fill="#10b981"/>
    <!-- URL pill -->
    <rect x="100" y="22" width="280" height="20" rx="10" fill="#1e293b"/>
    <text x="240" y="36" text-anchor="middle"
          font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">
      polytradebot.cloud/dashboard
    </text>
    <!-- Status dot -->
    <circle cx="525" cy="32" r="4" fill="#10b981"/>

    <!-- Sidebar (nav) -->
    <rect x="20" y="50" width="118" height="296" fill="#f8fafc"/>
    <line x1="138" y1="50" x2="138" y2="346" stroke="#e5e7eb"/>
    <!-- Sidebar items -->
    <rect x="32" y="68" width="94" height="28" rx="6" fill="#0c9d5b" fill-opacity="0.12"/>
    <rect x="40" y="78" width="12" height="8"  rx="2" fill="#0a8249"/>
    <text x="58" y="86" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#0a8249">Dashboard</text>

    <rect x="40" y="106" width="12" height="8" rx="2" fill="#94a3b8"/>
    <text x="58" y="114" font-family="Inter, sans-serif" font-size="11" fill="#475569">Settings</text>
    <rect x="40" y="134" width="12" height="8" rx="2" fill="#94a3b8"/>
    <text x="58" y="142" font-family="Inter, sans-serif" font-size="11" fill="#475569">Metrics</text>
    <rect x="40" y="162" width="12" height="8" rx="2" fill="#94a3b8"/>
    <text x="58" y="170" font-family="Inter, sans-serif" font-size="11" fill="#475569">Logs</text>

    <!-- Mode chip -->
    <rect x="32" y="296" width="94" height="22" rx="11" fill="#0c9d5b"/>
    <circle cx="44" cy="307" r="3" fill="#ffffff"/>
    <text x="52" y="311" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#ffffff" letter-spacing="0.04em">PAPER MODE</text>
  </g>

  <!-- Main content -->
  <g transform="translate(158, 60)">
    <!-- Header -->
    <text x="0" y="14" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0f172a">BTC 5-min · ventana actual</text>
    <text x="0" y="30" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Strike 76,108.12 · TWAP-60s 76,108.35 · gap $0.23</text>

    <!-- KPI tiles -->
    <g transform="translate(0, 46)">
      <rect x="0"   y="0" width="118" height="58" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
      <text x="10" y="18" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#64748b" letter-spacing="0.06em">BTC PRICE</text>
      <text x="10" y="38" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#0f172a">76,142.50</text>
      <text x="10" y="50" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#10b981">▲ +0.045%</text>

      <rect x="128" y="0" width="118" height="58" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
      <text x="138" y="18" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#64748b" letter-spacing="0.06em">ITM</text>
      <text x="138" y="38" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#0f172a">+0.045%</text>
      <text x="138" y="50" font-family="Inter, sans-serif" font-size="9" fill="#64748b">vs strike</text>

      <rect x="256" y="0" width="118" height="58" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
      <text x="266" y="18" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#64748b" letter-spacing="0.06em">TRADES HOY</text>
      <text x="266" y="38" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#0f172a">42</text>
      <text x="266" y="50" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#10b981">64% win</text>
    </g>

    <!-- Price chart -->
    <g transform="translate(0, 120)">
      <text x="0" y="0" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#64748b" letter-spacing="0.06em">BTC · ÚLTIMOS 60s</text>
      <line x1="0" y1="100" x2="370" y2="100" stroke="#e5e7eb"/>
      <line x1="0" y1="78"  x2="370" y2="78"  stroke="#f1f5f9" stroke-dasharray="2 4"/>
      <!-- Strike reference -->
      <line x1="0" y1="56" x2="370" y2="56" stroke="#0a8249" stroke-dasharray="3 4" stroke-width="1"/>
      <text x="368" y="53" text-anchor="end" font-family="Inter, sans-serif" font-size="8" fill="#0a8249" font-weight="600">strike</text>
      <!-- Area + line -->
      <path d="M0,80 L30,72 L60,68 L90,74 L120,62 L150,55 L180,60 L210,52 L240,48 L270,55 L300,42 L330,38 L360,46 L370,44 L370,100 L0,100 Z"
            fill="url(#dp-up)" opacity="0.7"/>
      <path d="M0,80 L30,72 L60,68 L90,74 L120,62 L150,55 L180,60 L210,52 L240,48 L270,55 L300,42 L330,38 L360,46 L370,44"
            fill="none" stroke="#0c9d5b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- Latest tick dot -->
      <circle cx="370" cy="44" r="4" fill="#0c9d5b" stroke="#ffffff" stroke-width="2"/>
    </g>

    <!-- Recent trades table -->
    <g transform="translate(0, 244)">
      <text x="0" y="0" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#64748b" letter-spacing="0.06em">ÚLTIMOS TRADES</text>
      <g transform="translate(0, 12)">
        <rect x="0"   y="0" width="118" height="32" rx="6" fill="#f8fafc"/>
        <circle cx="14" cy="16" r="3" fill="#10b981"/><text x="24" y="20" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#0f172a">UP @0.55</text>
        <text x="80" y="20" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#10b981">+$44</text>

        <rect x="128" y="0" width="118" height="32" rx="6" fill="#f8fafc"/>
        <circle cx="142" cy="16" r="3" fill="#ef4444"/><text x="152" y="20" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#0f172a">DOWN@0.30</text>
        <text x="208" y="20" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#10b981">+$56</text>

        <rect x="256" y="0" width="118" height="32" rx="6" fill="#f8fafc"/>
        <circle cx="270" cy="16" r="3" fill="#10b981"/><text x="280" y="20" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#0f172a">UP @0.58</text>
        <text x="336" y="20" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#10b981">+$34</text>
      </g>
    </g>
  </g>
</svg>
